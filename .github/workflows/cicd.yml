name: Heart Disease OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  oidc-debug:
    name: Debug OIDC Token
    runs-on: ubuntu-latest

    steps:

      - name: Request OIDC token
        id: oidc
        run: |
          RESPONSE=$(curl -sSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          echo "$RESPONSE" > oidc-response.json

          echo "OIDC response received"

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          echo "OIDC token obtained successfully"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          # Decode JWT payload
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_owner,
            repository_id,
            repository_owner_id,
            ref,
            event_name
          }'