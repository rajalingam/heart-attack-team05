name: Heart Disease CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  API_ECR_REPOSITORY: heart-disease-api
  UI_ECR_REPOSITORY: heart-disease-ui

jobs:

  # ==========================================
  # 1. RUN TESTS
  # ==========================================

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # ==========================================
  # 2. BUILD AND PUSH DOCKER IMAGES
  # ==========================================

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs: test

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      # ----------------------------------------
      # AWS Authentication
      # ----------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}


      # ----------------------------------------
      # Verify AWS
      # ----------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ----------------------------------------
      # Login to ECR
      # ----------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------
      # Build and Push API
      # ----------------------------------------

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          docker build \
            -f docker/Dockerfile.api \
            -t $REGISTRY/$API_ECR_REPOSITORY:$IMAGE_TAG .

          docker push \
            $REGISTRY/$API_ECR_REPOSITORY:$IMAGE_TAG


      # ----------------------------------------
      # Build and Push UI
      # ----------------------------------------

      - name: Build and push UI image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          docker build \
            -f docker/Dockerfile.ui \
            -t $REGISTRY/$UI_ECR_REPOSITORY:$IMAGE_TAG .

          docker push \
            $REGISTRY/$UI_ECR_REPOSITORY:$IMAGE_TAG