name: Heart Disease CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  docker-build:

    name: Build Docker Images
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t heart-disease-api:latest .

      - name: Build UI image
        run: |
          docker build \
            -f docker/Dockerfile.ui \
            -t heart-disease-ui:latest .

- name: Configure AWS credentials
  uses: aws-actions/configure-aws-credentials@v4
  with:
    role-to-assume: ${{ vars.AWS_GITHUB_ROLE }}
    aws-region: ${{ vars.AWS_REGION }}

- name: Login to ECR
  id: login-ecr
  uses: aws-actions/amazon-ecr-login@v2

- name: Build and push API
  env:
    REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    IMAGE_TAG: ${{ github.sha }}
  run: |
    docker build \
      -f docker/Dockerfile.api \
      -t $REGISTRY/heart-disease-api:$IMAGE_TAG .

    docker push \
      $REGISTRY/heart-disease-api:$IMAGE_TAG